name: Auto Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment version
        id: version
        run: |
          # get latest tag, default to 0.0.0 if none
          LATEST=$(git tag --sort=-v:refname | head -1)
          LATEST=${LATEST:-0.0.0}
          echo "Latest tag: $LATEST"

          MAJOR=$(echo $LATEST | cut -d. -f1)
          MINOR=$(echo $LATEST | cut -d. -f2)
          PATCH=$(echo $LATEST | cut -d. -f3)

          PATCH=$((PATCH + 1))
          if [ $PATCH -gt 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          if [ $MINOR -gt 9 ]; then
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Bump version in gradle files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" mediatork/build.gradle.kts 2>/dev/null || \
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" mediatork/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: ./gradlew :mediatork:publishAllPublicationsToCentralPortal
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Commit version bump and tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git config user.email "ci@github.com"
          git config user.name "CI"
          git add mediatork/build.gradle.kts
          git commit -m "release: $VERSION"
          git tag $VERSION
          git push origin HEAD:main
          git push origin $VERSION

      - name: Delete release branch
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          git push origin --delete $BRANCH

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
