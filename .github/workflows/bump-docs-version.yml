name: Bump Docs Version

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest version from Maven Central
        id: version
        run: |
          VERSION=$(curl -s "https://search.maven.org/solrsearch/select?q=g:io.github.fajrbahr+AND+a:mediatork&core=gav&rows=1&wt=json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['response']['docs'][0]['v'])")
          echo "Latest version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version in docs and readme
        run: |
          VERSION=${{ steps.version.outputs.version }}
          find website/docs readme.md -name "*.md" | xargs sed -i "s/[0-9]\+\.[0-9]\+\.[0-9]\+/$VERSION/g"

      - name: Commit updated docs
        run: |
          git config user.email "ci@github.com"
          git config user.name "CI"
          git add website/docs readme.md
          git diff --staged --quiet || git commit -m "docs: bump version to ${{ steps.version.outputs.version }}"
          git push

  build:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
