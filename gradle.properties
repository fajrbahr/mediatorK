kotlin.code.style=official
# Set these in ~/.gradle/gradle.properties — never commit credentials to git
# GPG signing (in-memory, recommended for CI)
# signingKey=-----BEGIN PGP PRIVATE KEY BLOCK-----\n...\n-----END PGP PRIVATE KEY BLOCK-----
# signingPassword=your_gpg_passphrase
# Maven Central Portal token (generate at https://central.sonatype.com → User Token)
# mavenCentralUsername=your_token_username
# mavenCentralPassword=your_token_password
