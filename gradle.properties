org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.code.style=official
# Single source of truth for the coordinates of every published module.
# Gradle applies `group` and `version` from here to all projects automatically.
group=io.github.fajrbahr
version=0.7.0
# Dokka Gradle plugin v2 mode
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
# Set these in ~/.gradle/gradle.properties — never commit credentials to git
# GPG signing (in-memory, recommended for CI)
# signingKey=-----BEGIN PGP PRIVATE KEY BLOCK-----\n...\n-----END PGP PRIVATE KEY BLOCK-----
# signingPassword=your_gpg_passphrase
# Maven Central Portal token (generate at https://central.sonatype.com → User Token)
# mavenCentralUsername=your_token_username
# mavenCentralPassword=your_token_password
